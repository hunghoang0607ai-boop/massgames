<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Quản trị MassGames</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#12141a;color:#e8e8e8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px}
a{color:#8b93a7;text-decoration:none}
a:hover{color:#f0c060}
.hidden{display:none !important}
.small{font-size:12px;color:#8a92a6}
.ok{color:#7fdc8a}.err{color:#ff7b7b}

/* Đăng nhập */
#login-view{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login-box{width:100%;max-width:380px;background:#1a1d26;border:1px solid #2a3144;border-radius:10px;padding:22px}
.login-box h1{margin:0 0 14px;font-size:20px;color:#f0c060}
label{display:block;font-size:12px;color:#8b93a7;margin:10px 0 3px}

/* Khung ERP */
#app-view{display:flex;min-height:100vh}
.sidebar{width:248px;flex-shrink:0;background:#0e1016;border-right:1px solid #2a3144;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.sidebar .brand{padding:16px;font-weight:bold;color:#f0c060;border-bottom:1px solid #2a3144}
.sidebar .brand small{display:block;font-weight:normal;color:#8a92a6;font-size:12px;margin-top:2px}
.sidebar .section{padding:12px 16px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#6b7390}
.nav{overflow-y:auto;flex:1;padding:0 8px 8px}
.nav button{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;color:#cfd6e4;border-radius:8px;padding:9px 10px;font-size:14px;cursor:pointer;margin:2px 0}
.nav button:hover{background:#1a1d26}
.nav button.active{background:#243055;border-color:#3b4a78;color:#fff}
.nav button .sub{display:block;font-size:11px;color:#7d86a0;margin-top:2px}
.sidebar .foot{padding:12px 16px;border-top:1px solid #2a3144;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sidebar .foot button{margin:0}

.content{flex:1;min-width:0;padding:20px 24px 40px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:4px;flex-wrap:wrap}
.topbar h1{margin:0;font-size:22px;color:#f0c060}
.gamelayout{display:flex;gap:16px;margin-top:14px;align-items:flex-start}
.subnav{width:170px;flex-shrink:0;display:flex;flex-direction:column;gap:4px;background:#0e1016;border:1px solid #2a3144;border-radius:10px;padding:6px}
.subnav button{text-align:left;background:transparent;border:1px solid transparent;color:#cfd6e4;border-radius:8px;padding:9px 10px;margin:0;font-size:14px}
.subnav button:hover{background:#1a1d26}
.subnav button.active{background:#243055;border-color:#3b4a78;color:#fff}
.panel{flex:1;min-width:0}
h2{font-size:15px;color:#c9d1e0;margin:20px 0 10px;border-bottom:1px solid #2a3144;padding-bottom:6px}
h2:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.item{background:#1a1d26;border:1px solid #2a3144;border-radius:8px;padding:12px}
.item h3{margin:0 0 8px;font-size:15px;color:#f0c060}
.card{background:#1a1d26;border:1px solid #2a3144;border-radius:10px;padding:16px;margin-bottom:16px}
input[type=text],input[type=email],input[type=password],input[type=number],select{width:100%;background:#0e1016;color:#eee;border:1px solid #47506a;border-radius:6px;padding:6px 8px;font-size:13px}
input[type=file]{color:#cfd6e4;margin-top:4px}
input[type=color]{width:100%;height:30px;background:#0e1016;border:1px solid #47506a;border-radius:6px;padding:2px}
button{background:#2a3144;color:#eee;border:1px solid #47506a;border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer;margin-top:10px}
button:hover:not(:disabled){background:#384262}
button:disabled{opacity:.4;cursor:not-allowed}
button.go{background:#2f7d3a;border-color:#3f9c4b;font-weight:bold}
button.danger{background:#5a2a2a;border-color:#7a3a3a}
.status{margin-top:10px;min-height:20px;white-space:pre-wrap}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.empty{background:#1a1d26;border:1px dashed #3a4262;border-radius:10px;padding:24px;color:#8a92a6}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px;border-bottom:1px solid #2a3144;vertical-align:top}
th{color:#8b93a7;font-weight:normal;font-size:12px}
.use{color:#c9d1e0;font-size:12px}
.use .none{color:#6b7390}

@media (max-width:760px){
  #app-view{flex-direction:column}
  .sidebar{width:100%;height:auto;position:static;border-right:0;border-bottom:1px solid #2a3144}
  .nav{display:flex;overflow-x:auto;overflow-y:hidden;gap:6px;padding:8px}
  .nav button{white-space:nowrap;width:auto;margin:0}
  .nav button .sub{display:none}
  .content{padding:14px}
  .gamelayout{flex-direction:column}
  .subnav{width:100%;flex-direction:row}
  .subnav button{flex:1;text-align:center}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../../assets/config.js"></script>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
// Dựng ảnh xem trước từ file .glb/.gltf bằng Three.js (chạy trên trình duyệt, không cần lưu ảnh riêng).
import * as THREE from 'three';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
const W=320, H=240;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1); renderer.setSize(W,H);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(35,W/H,0.01,1000);
scene.add(new THREE.AmbientLight(0xffffff,0.9));
const sun=new THREE.DirectionalLight(0xffffff,1.4); sun.position.set(3,5,4); scene.add(sun);
const loader=new GLTFLoader();
const cache=new Map();
let chain=Promise.resolve();   // xếp hàng để chỉ dựng một lúc
function render(url){
  if(cache.has(url)) return Promise.resolve(cache.get(url));
  const job=chain.then(async()=>{
    const gltf=await loader.loadAsync(url);
    const obj=gltf.scene;
    scene.add(obj);
    const box=new THREE.Box3().setFromObject(obj);
    const size=box.getSize(new THREE.Vector3()), ctr=box.getCenter(new THREE.Vector3());
    // Bán kính bao quanh toàn bộ mô hình: đảm bảo mô hình luôn nằm trọn trong khung, mọi hướng
    const radius=(size.length()/2)||1;
    const d=radius/Math.sin(THREE.MathUtils.degToRad(camera.fov/2))*1.1;
    camera.position.set(ctr.x+d*0.6,ctr.y+d*0.3,ctr.z+d*0.8);
    camera.lookAt(ctr);
    renderer.render(scene,camera);
    const data=renderer.domElement.toDataURL('image/png');
    scene.remove(obj);
    obj.traverse(o=>{ if(o.geometry) o.geometry.dispose(); });
    cache.set(url,data);
    return data;
  });
  chain=job.catch(()=>{});
  return job;
}
window.mgThumb=render;
window.dispatchEvent(new Event('mgthumb-ready'));
</script>
</head>
<body>

<!-- Đăng nhập -->
<div id="login-view" class="hidden">
  <div class="login-box">
    <h1>Quản trị MassGames</h1>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username">
    <label for="password">Mật khẩu</label>
    <input id="password" type="password" autocomplete="current-password">
    <div class="row">
      <button class="go" id="btn-login">Đăng nhập</button>
      <button id="btn-google">Đăng nhập bằng Google</button>
    </div>
    <div class="status" id="login-status"></div>
    <div class="small" style="margin-top:12px"><a href="../../">← Về trang chủ</a></div>
  </div>
</div>

<!-- Giao diện quản trị -->
<div id="app-view" class="hidden">
  <aside class="sidebar">
    <div class="brand">MassGames<small>Quản trị game</small></div>
    <div class="section">Danh sách game</div>
    <nav class="nav" id="game-nav"></nav>
    <div class="foot">
      <span class="small" id="who"></span>
      <button id="btn-logout">Đăng xuất</button>
    </div>
  </aside>

  <main class="content">
    <div class="topbar">
      <h1 id="page-title">Chọn một game</h1>
      <a href="../../">← Trang chủ</a>
    </div>
    <div class="small" id="page-sub"></div>
    <div class="status" id="global-status"></div>
    <div class="gamelayout" id="game-body"></div>
  </main>
</div>

<script>
(function(){
  const cfg = window.MASSGAMES_CONFIG;
  const BUCKET = 'models-3d';
  const MAX_BYTES = 100 * 1024 * 1024;
  const db = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_PUBLISHABLE_KEY, {
    auth: { persistSession: true, autoRefreshToken: true }
  });
  const $ = id => document.getElementById(id);
  let games = [];
  let assets = [];          // assets_3d (dùng chung cho mọi game)
  let allEntities = [];     // game_entities của mọi game, để biết mô hình nào đang được dùng ở đâu
  let currentSlug = null;
  let currentTab = 'config';
  let selected = new Set();  // id các file 3D đang chọn để xoá
  let armedFor = null;       // số file đang chờ xác nhận xoá (xác nhận hai bước, thay cho confirm())
  let armedRow = null;       // id dòng đang chờ xác nhận xoá
  let currentConfig = {};   // map 'kind:key' -> config của game đang mở

  // Cấu hình 3D theo từng game. Game chưa có khai báo sẽ không có mục Cấu hình.
  const SCHEMAS = {
    'zombie-fortress': {
      tower: {
        rifle:  { title:'Chốt bắn', fields:[['name','text','Tên'],['cost','num','Giá'],['range','num','Tầm bắn'],['dmg','num','Sát thương'],['rate','num','Chu kỳ bắn (s)'],['color','color','Màu nhấn'],['model','model','Mô hình 3D']] },
        shotgun:{ title:'Súng săn', fields:[['name','text','Tên'],['cost','num','Giá'],['range','num','Tầm bắn'],['dmg','num','Sát thương'],['rate','num','Chu kỳ bắn (s)'],['color','color','Màu nhấn'],['model','model','Mô hình 3D']] },
        flame:  { title:'Bình lửa', fields:[['name','text','Tên'],['cost','num','Giá'],['range','num','Tầm bắn'],['dmg','num','Sát thương'],['rate','num','Chu kỳ bắn (s)'],['color','color','Màu nhấn'],['model','model','Mô hình 3D']] }
      },
      zombie: {
        walker:{ title:'Walker', fields:[['hp','num','Máu'],['speed','num','Tốc độ'],['dmg','num','Sát thương'],['r','num','Bán kính'],['gold','num','Vàng thưởng'],['scale','num','Tỉ lệ 3D'],['color','color','Màu da'],['model','model','Mô hình 3D']] },
        runner:{ title:'Runner', fields:[['hp','num','Máu'],['speed','num','Tốc độ'],['dmg','num','Sát thương'],['r','num','Bán kính'],['gold','num','Vàng thưởng'],['scale','num','Tỉ lệ 3D'],['color','color','Màu da'],['model','model','Mô hình 3D']] },
        tank:  { title:'Tank', fields:[['hp','num','Máu'],['speed','num','Tốc độ'],['dmg','num','Sát thương'],['r','num','Bán kính'],['gold','num','Vàng thưởng'],['scale','num','Tỉ lệ 3D'],['color','color','Màu da'],['model','model','Mô hình 3D']] },
        boss:  { title:'Boss', fields:[['hp','num','Máu'],['speed','num','Tốc độ'],['dmg','num','Sát thương'],['r','num','Bán kính'],['gold','num','Vàng thưởng'],['scale','num','Tỉ lệ 3D'],['color','color','Màu da'],['model','model','Mô hình 3D']] }
      },
      building: {
        house:      { title:'Nhà dân', fields:[['wall_color','color','Màu tường'],['roof_color','color','Màu mái'],['model','model','Mô hình 3D (thay cả nhà)']] },
        wall_wood:  { title:'Tường gỗ', fields:[['color','color','Màu gỗ']] },
        wall_stone: { title:'Tường đá', fields:[['color','color','Màu đá']] }
      }
    }
  };
  const GROUPS = [['tower','Tháp'],['zombie','Loại zombie'],['building','Công trình']];
  const KIND_LABEL = { tower:'Tháp', zombie:'Zombie', building:'Công trình' };

  function setStatus(id,msg,cls){ const el=$(id); el.textContent=msg; el.className='status '+(cls||''); }
  function fmtSize(b){ if(!b && b!==0) return ''; if(b<1024) return b+' B'; if(b<1048576) return (b/1024).toFixed(1)+' KB'; return (b/1048576).toFixed(1)+' MB'; }
  function safeName(s){ return s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9_-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60) || 'model'; }

  // ---------- Đăng nhập ----------
  function showAuth(session){
    const logged=!!session;
    $('login-view').classList.toggle('hidden',logged);
    $('app-view').classList.toggle('hidden',!logged);
    if(logged){ $('who').textContent=session.user.email; loadGames(); }
  }

  // ---------- Danh sách game (thanh bên) ----------
  async function loadGames(){
    const {data,error}=await db.from('games').select('slug,title').order('title');
    if(error){ setStatus('global-status','Lỗi tải danh sách game: '+error.message,'err'); return; }
    games=data||[];
    renderNav();
    if(!currentSlug && games.length) selectGame(games[0].slug);
    else if(currentSlug) selectGame(currentSlug);
  }

  function renderNav(){
    const nav=$('game-nav'); nav.textContent='';
    games.forEach(g=>{
      const b=document.createElement('button');
      b.className=g.slug===currentSlug?'active':'';
      b.textContent=g.title||g.slug;
      const s=document.createElement('span'); s.className='sub';
      s.textContent=SCHEMAS[g.slug]?'Có cấu hình 3D':'Chưa có cấu hình 3D';
      b.appendChild(s);
      b.onclick=()=>selectGame(g.slug);
      nav.appendChild(b);
    });
  }

  async function selectGame(slug){
    currentSlug=slug;
    renderNav();
    const g=games.find(x=>x.slug===slug);
    $('page-title').textContent=g?(g.title||slug):slug;
    $('page-sub').textContent='Mã game: '+slug;
    setStatus('global-status','Đang tải...');
    const [rowsRes, assetsRes] = await Promise.all([
      db.from('game_entities').select('game_slug,kind,key,config'),
      db.from('assets_3d').select('id,name,storage_path,format,size_bytes,created_at,folder').order('created_at',{ascending:false})
    ]);
    if(currentSlug!==slug) return; // người dùng đã chuyển sang game khác
    if(rowsRes.error||assetsRes.error){ setStatus('global-status','Lỗi tải dữ liệu: '+((rowsRes.error||assetsRes.error).message),'err'); return; }
    setStatus('global-status','');
    assets = assetsRes.data || [];
    allEntities = rowsRes.data || [];
    currentConfig = {};
    allEntities.filter(r=>r.game_slug===slug).forEach(r=>{ currentConfig[r.kind+':'+r.key]=r.config||{}; });
    renderLayout();
  }

  // ---------- Khung: thanh con (Cấu hình | 3D Object) + nội dung ----------
  function renderLayout(){
    const body=$('game-body'); body.textContent='';
    const sub=document.createElement('nav'); sub.className='subnav';
    const tabs=[['config','Cấu hình'],['objects','3D Object']];
    if(currentSlug==='my-city') tabs.push(['boundaries','Ranh giới thành phố']);
    if(currentSlug==='outbreak-city') tabs.push(['districts','Quận thành phố']);
    tabs.forEach(([id,label])=>{
      const b=document.createElement('button');
      b.textContent=label; b.className=currentTab===id?'active':'';
      b.onclick=()=>{ currentTab=id; renderLayout(); };
      sub.appendChild(b);
    });
    const panel=document.createElement('div'); panel.className='panel';
    body.appendChild(sub); body.appendChild(panel);
    if(currentTab==='config') renderConfig(panel);
    else if(currentTab==='boundaries') renderBoundaries(panel);
    else if(currentTab==='districts') renderDistricts(panel);
    else renderObjects(panel);
  }

  // ---------- Thanh con "Cấu hình" ----------
  function renderConfig(panel){
    const schema=SCHEMAS[currentSlug];
    if(!schema){
      const d=document.createElement('div'); d.className='empty';
      d.textContent='Game này chưa có mục cấu hình 3D. Dùng mục 3D Object để tải và xem file mô hình.';
      panel.appendChild(d); return;
    }
    GROUPS.forEach(([kind,label])=>{
      const defs=schema[kind]; if(!defs) return;
      const h=document.createElement('h2'); h.textContent=label; panel.appendChild(h);
      const grid=document.createElement('div'); grid.className='grid';
      Object.keys(defs).forEach(key=>{
        grid.appendChild(buildCard(kind,key,defs[key],currentConfig[kind+':'+key]||{}));
      });
      panel.appendChild(grid);
    });
  }

  function buildCard(kind,key,def,config){
    const slug=currentSlug;
    const card=document.createElement('div'); card.className='item';
    const h=document.createElement('h3'); h.textContent=def.title; card.appendChild(h);
    const inputs={};
    def.fields.forEach(([field,type,label])=>{
      const l=document.createElement('label'); l.textContent=label; card.appendChild(l);
      let input;
      if(type==='model'){
        input=document.createElement('select');
        const none=document.createElement('option'); none.value=''; none.textContent='— Không dùng (hình mặc định) —';
        input.appendChild(none);
        assets.forEach(a=>{ const o=document.createElement('option'); o.value=a.id; o.textContent=a.name+' ('+a.format.toUpperCase()+')'; input.appendChild(o); });
        input.value=config.model_id||'';
      } else if(type==='color'){
        input=document.createElement('input'); input.type='color';
        const cur=(field==='color'||field.endsWith('_color')) ? config[field] : null;
        input.value=/^#[0-9a-fA-F]{6}$/.test(cur||'')?cur:'#888888';
      } else if(type==='num'){
        input=document.createElement('input'); input.type='number'; input.step='any';
        input.value=config[field]!==undefined?config[field]:'';
      } else {
        input=document.createElement('input'); input.type='text';
        input.value=config[field]!==undefined?config[field]:'';
      }
      inputs[field]={el:input,type};
      card.appendChild(input);
    });
    const btn=document.createElement('button'); btn.className='go'; btn.textContent='Lưu';
    const st=document.createElement('div'); st.className='small';
    btn.onclick=async()=>{
      btn.disabled=true; st.className='small'; st.textContent='Đang lưu...';
      const newCfg={...config};
      for(const [field,{el,type}] of Object.entries(inputs)){
        if(type==='model'){ if(el.value) newCfg.model_id=el.value; else delete newCfg.model_id; }
        else if(type==='num'){ if(el.value!=='') newCfg[field]=Number(el.value); }
        else newCfg[field]=el.value;
      }
      const {error}=await db.from('game_entities').upsert({game_slug:slug,kind,key,config:newCfg},{onConflict:'game_slug,kind,key'});
      btn.disabled=false;
      if(error){ st.className='small err'; st.textContent='Lỗi: '+error.message; return; }
      Object.assign(config,newCfg);
      st.className='small ok'; st.textContent='Đã lưu lúc '+new Date().toLocaleTimeString('vi-VN');
    };
    card.appendChild(btn); card.appendChild(st);
    return card;
  }

  // ---------- Thanh con "3D Object": tải file, xem nơi đang dùng, xoá ----------
  function usagesOf(assetId){
    const list=[];
    allEntities.forEach(r=>{
      if(r.config && r.config.model_id===assetId){
        const g=games.find(x=>x.slug===r.game_slug);
        list.push(((g&&g.title)||r.game_slug)+' → '+(KIND_LABEL[r.kind]||r.kind)+': '+(SCHEMAS[r.game_slug]&&SCHEMAS[r.game_slug][r.kind]&&SCHEMAS[r.game_slug][r.kind][r.key]?SCHEMAS[r.game_slug][r.kind][r.key].title:r.key));
      }
    });
    return list;
  }

  function renderObjects(panel){
    const up=document.createElement('div'); up.className='card';
    up.innerHTML='<h2 style="margin-top:0">Tải file 3D lên</h2>'
      +'<label for="o-name">Tên hiển thị (chỉ dùng khi chọn 1 file; để trống sẽ dùng tên file)</label>'
      +'<input id="o-name" type="text">'
      +'<label for="o-file">File (chọn cả file chính và file phụ cùng lúc; tối đa 100 MB mỗi file)</label>'
      +'<input id="o-file" type="file" multiple accept=".glb,.gltf,.fbx,.obj,.bin,.png,.jpg,.jpeg,.webp">'
      +'<div class="small" style="margin-top:6px">File chính: .glb, .gltf, .fbx, .obj. File phụ: .bin, .png, .jpg, .jpeg, .webp (dữ liệu và ảnh texture mà file .gltf cần). Tên file phụ phải giữ nguyên như trong file .gltf, chỉ dùng chữ không dấu, số, . - _. Game chỉ hiển thị được .glb và .gltf.</div>'
      +'<div class="row"><button class="go" id="o-upload">Tải lên</button></div>'
      +'<div class="status" id="o-status"></div>';
    panel.appendChild(up);

    const list=document.createElement('div'); list.className='card';
    list.innerHTML='<h2 style="margin-top:0">Danh sách file 3D</h2><div class="status" id="o-list-status"></div><div class="row" id="o-toolbar" style="margin:8px 0"></div><div id="o-table"></div>';
    panel.appendChild(list);

    up.querySelector('#o-upload').onclick=uploadAsset;
    renderAssetTable();
  }

  function renderAssetTable(){
    const host=document.getElementById('o-table'); if(!host) return;
    selected=new Set([...selected].filter(id=>assets.some(a=>a.id===id)));
    host.textContent='';
    updateToolbar();
    if(!assets.length){ setStatus('o-list-status','Chưa có file 3D nào.'); return; }
    setStatus('o-list-status','');
    const table=document.createElement('table');
    table.innerHTML='<thead><tr><th><input type="checkbox" id="o-all" title="Chọn tất cả"></th><th>Ảnh</th><th>Tên</th><th>Định dạng</th><th>Dung lượng</th><th>Đang gán cho</th><th></th></tr></thead>';
    const tbody=document.createElement('tbody');
    const allCb=table.querySelector('#o-all');
    allCb.checked=assets.every(a=>selected.has(a.id));
    allCb.onchange=()=>{
      selected = allCb.checked ? new Set(assets.map(a=>a.id)) : new Set();
      tbody.querySelectorAll('input[type=checkbox]').forEach(cb=>{ cb.checked=allCb.checked; });
      updateToolbar();
    };
    assets.forEach(a=>{
      const tr=document.createElement('tr');
      const tdChk=document.createElement('td');
      const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=selected.has(a.id);
      cb.onchange=()=>{
        if(cb.checked) selected.add(a.id); else selected.delete(a.id);
        allCb.checked=assets.every(x=>selected.has(x.id));
        updateToolbar();
      };
      tdChk.appendChild(cb); tr.appendChild(tdChk);
      const tdImg=document.createElement('td'); tdImg.appendChild(thumbCell(a)); tr.appendChild(tdImg);
      const tdName=document.createElement('td'); tdName.textContent=a.name; tr.appendChild(tdName);
      const tdFmt=document.createElement('td'); tdFmt.textContent=(a.format||'').toUpperCase(); tr.appendChild(tdFmt);
      const tdSize=document.createElement('td'); tdSize.textContent=fmtSize(a.size_bytes); tr.appendChild(tdSize);
      const tdUse=document.createElement('td'); tdUse.className='use';
      const uses=usagesOf(a.id);
      if(!uses.length){ const n=document.createElement('span'); n.className='none'; n.textContent='Chưa gán'; tdUse.appendChild(n); }
      else uses.forEach(u=>{ const d=document.createElement('div'); d.textContent=u; tdUse.appendChild(d); });
      tr.appendChild(tdUse);
      const tdAct=document.createElement('td');
      const del=document.createElement('button'); del.className='danger'; del.style.margin='0'; del.textContent='Xoá';
      del.onclick=()=>deleteAsset(a,uses,del);
      tdAct.appendChild(del); tr.appendChild(tdAct);
      tbody.appendChild(tr);
    });
    table.appendChild(tbody); host.appendChild(table);
  }

  function updateToolbar(){
    const bar=document.getElementById('o-toolbar'); if(!bar) return;
    const n=selected.size;
    bar.textContent='';
    const info=document.createElement('span'); info.className='small';
    info.textContent=n?('Đã chọn '+n+' file'):'Chưa chọn file nào';
    const del=document.createElement('button'); del.className='danger'; del.style.margin='0';
    del.disabled=!n; del.textContent=(armedFor===n?'Xác nhận xoá (':'Xoá đã chọn (')+n+')';
    del.onclick=deleteSelected;
    const clr=document.createElement('button'); clr.style.margin='0';
    clr.disabled=!n; clr.textContent='Bỏ chọn';
    clr.onclick=()=>{ selected.clear(); renderAssetTable(); };
    bar.appendChild(info); bar.appendChild(del); bar.appendChild(clr);
  }

  async function deleteSelected(){
    const picked=assets.filter(a=>selected.has(a.id));
    if(!picked.length) return;
    if(armedFor!==picked.length){
      armedFor=picked.length;
      const inUse=picked.filter(a=>usagesOf(a.id).length).length;
      setStatus('o-list-status','Bấm "Xác nhận xoá" lần nữa để xoá '+picked.length+' file. Không thể hoàn tác.'+(inUse?' '+inUse+' file đang được gán; các mục đó sẽ dùng hình mặc định sau khi xoá.':''),'err');
      updateToolbar();
      return;
    }
    armedFor=null;
    setStatus('o-list-status','Đang xoá '+picked.length+' file...');
    const err=await removeAssets(picked);
    if(err){ setStatus('o-list-status',err,'err'); return; }
    selected.clear();
    await reloadAssets();
    setStatus('o-list-status','Đã xoá '+picked.length+' file.','ok');
  }

  function publicUrlOf(a){ return db.storage.from(BUCKET).getPublicUrl(a.storage_path).data.publicUrl; }

  function thumbCell(a){
    const box=document.createElement('div');
    box.style.cssText='width:160px;height:120px;background:#0e1016;border:1px solid #2a3144;border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#6b7390;font-size:12px;text-align:center;padding:6px';
    const fmt=(a.format||'').toLowerCase();
    if(fmt!=='glb' && fmt!=='gltf'){ box.textContent='Không xem trước được ('+fmt.toUpperCase()+')'; return box; }
    box.textContent='Đang tạo ảnh...';
    const waitReady = window.mgThumb ? Promise.resolve() : new Promise(res=>window.addEventListener('mgthumb-ready',res,{once:true}));
    waitReady.then(()=>window.mgThumb(publicUrlOf(a))).then(dataUrl=>{
      const img=document.createElement('img'); img.src=dataUrl; img.alt=a.name;
      img.style.cssText='width:100%;height:100%;object-fit:contain';
      box.textContent=''; box.appendChild(img);
    }).catch(()=>{ box.textContent='Không tạo được ảnh'; });
    return box;
  }

  async function reloadAssets(){
    const [a,e]=await Promise.all([
      db.from('assets_3d').select('id,name,storage_path,format,size_bytes,created_at,folder').order('created_at',{ascending:false}),
      db.from('game_entities').select('game_slug,kind,key,config')
    ]);
    if(!a.error) assets=a.data||[];
    if(!e.error) allEntities=e.data||[];
    renderAssetTable();
  }

  const MAIN_EXT=['glb','gltf','fbx','obj'];
  const DEP_EXT=['bin','png','jpg','jpeg','webp'];
  const SAFE_RE=/^[A-Za-z0-9._-]+$/;
  const CT={glb:'model/gltf-binary',gltf:'model/gltf+json',bin:'application/octet-stream',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',webp:'image/webp'};
  function extOf(n){ return (n.split('.').pop()||'').toLowerCase(); }

  // Tải cả nhóm (file chính + file phụ) vào cùng một thư mục, giữ nguyên tên file để file .gltf tìm được file phụ.
  async function uploadAsset(){
    const files=Array.from(document.getElementById('o-file').files||[]);
    const typedName=document.getElementById('o-name').value.trim();
    const btn=document.getElementById('o-upload');
    if(!files.length){ setStatus('o-status','Chọn ít nhất một file.','err'); return; }
    const problems=[];
    const mains=files.filter(f=>MAIN_EXT.includes(extOf(f.name)));
    files.filter(f=>!MAIN_EXT.includes(extOf(f.name))&&!DEP_EXT.includes(extOf(f.name)))
      .forEach(f=>problems.push(f.name+': định dạng không hỗ trợ'));
    if(!mains.length){ setStatus('o-status','Cần ít nhất một file chính (.glb, .gltf, .fbx, .obj).','err'); return; }

    const plan=[];
    files.forEach(f=>{
      const ext=extOf(f.name);
      if(!MAIN_EXT.includes(ext)&&!DEP_EXT.includes(ext)) return;
      if(f.size>MAX_BYTES){ problems.push(f.name+': vượt quá 100 MB'); return; }
      let name=f.name;
      if(!SAFE_RE.test(name)){
        if(['glb','fbx','obj'].includes(ext)) name=safeName(f.name.replace(/\.[^.]+$/,''))+'.'+ext; // file tự chứa, đổi tên được
        else { problems.push(f.name+': tên có ký tự đặc biệt (chỉ dùng chữ không dấu, số, . - _ để file .gltf tìm được)'); return; }
      }
      plan.push({file:f,name,ext,isMain:MAIN_EXT.includes(ext)});
    });
    if(problems.length){ setStatus('o-status','Chưa tải lên, cần sửa:\n'+problems.join('\n'),'err'); return; }

    btn.disabled=true;
    const folder='batch-'+Date.now();
    const mainCount=plan.filter(p=>p.isMain).length;
    const results=[];
    for(let i=0;i<plan.length;i++){
      const p=plan[i];
      const key=folder+'/'+p.name;
      const label='['+(i+1)+'/'+plan.length+'] '+p.file.name;
      setStatus('o-status','Đang tải lên '+label+' ('+fmtSize(p.file.size)+')...');
      const up=await db.storage.from(BUCKET).upload(key,p.file,{cacheControl:'3600',upsert:false,contentType:CT[p.ext]||'application/octet-stream'});
      if(up.error){ results.push(label+': lỗi tải file ('+up.error.message+')'); continue; }
      if(!p.isMain){ results.push(label+': đã tải (file phụ)'); continue; }
      const displayName=(mainCount===1&&typedName)?typedName:p.file.name;
      const ins=await db.from('assets_3d').insert({name:displayName,storage_path:key,format:p.ext,size_bytes:p.file.size,folder});
      if(ins.error){ await db.storage.from(BUCKET).remove([key]); results.push(label+': lỗi lưu thông tin ('+ins.error.message+')'); continue; }
      results.push(label+': đã lưu');
    }
    btn.disabled=false;
    const failed=results.some(r=>r.includes('lỗi'));
    setStatus('o-status',results.join('\n'),failed?'err':'ok');
    document.getElementById('o-name').value=''; document.getElementById('o-file').value='';
    reloadAssets();
  }

  // Xoá bản ghi và file chính. Khi thư mục không còn file chính nào thì dọn luôn file phụ trong thư mục.
  async function removeAssets(list){
    if(!list.length) return null;
    const r1=await db.storage.from(BUCKET).remove(list.map(a=>a.storage_path));
    if(r1.error) return 'Lỗi xoá file trong storage: '+r1.error.message;
    const r2=await db.from('assets_3d').delete().in('id',list.map(a=>a.id));
    if(r2.error) return 'Lỗi xoá bản ghi: '+r2.error.message;
    const folders=[...new Set(list.map(a=>a.folder).filter(Boolean))];
    for(const f of folders){
      const left=await db.from('assets_3d').select('id',{count:'exact',head:true}).eq('folder',f);
      if(left.error||left.count) continue;
      const ls=await db.storage.from(BUCKET).list(f,{limit:1000});
      if(!ls.error&&ls.data){
        const paths=ls.data.filter(x=>x.name&&x.id).map(x=>f+'/'+x.name);
        if(paths.length) await db.storage.from(BUCKET).remove(paths);
      }
    }
    return null;
  }

  async function deleteAsset(a,uses,btn){
    if(armedRow!==a.id){
      armedRow=a.id;
      btn.textContent='Xác nhận xoá';
      setStatus('o-list-status','Bấm "Xác nhận xoá" lần nữa để xoá "'+a.name+'". Không thể hoàn tác.'+(uses.length?' File đang được gán cho '+uses.length+' mục; các mục đó sẽ dùng hình mặc định sau khi xoá.':''),'err');
      return;
    }
    armedRow=null;
    const err=await removeAssets([a]);
    if(err){ setStatus('o-list-status',err,'err'); return; }
    reloadAssets();
  }

  // ---------- Thanh con "Ranh giới thành phố" (game My City) ----------
  const CITY_BOUNDARIES=[
    {id:'hanoi',name:'Hà Nội'},{id:'hcm',name:'TP. Hồ Chí Minh'},{id:'danang',name:'Đà Nẵng'},{id:'tokyo',name:'Tokyo'},
    {id:'singapore',name:'Singapore'},{id:'paris',name:'Paris'},{id:'london',name:'London'},{id:'newyork',name:'New York'}
  ];

  // Lấy ranh giới Polygon/MultiPolygon từ: Geometry, Feature, FeatureCollection, hoặc kết quả Nominatim (mảng)
  function geometryFrom(json){
    const pick=g=>(g&&(g.type==='Polygon'||g.type==='MultiPolygon'))?g:null;
    if(Array.isArray(json)){ for(const x of json){ const g=pick(x&&x.geojson); if(g) return g; } return null; }
    if(json&&json.type==='Feature') return pick(json.geometry);
    if(json&&json.type==='FeatureCollection'){ for(const f of json.features||[]){ const g=pick(f.geometry); if(g) return g; } return null; }
    return pick(json);
  }

  async function renderBoundaries(panel){
    const card=document.createElement('div'); card.className='card';
    card.innerHTML='<h2 style="margin-top:0">Ranh giới thành phố</h2>'
      +'<div class="small">Tải file GeoJSON hoặc JSON kết quả Nominatim của từng thành phố. Game chỉ đọc dữ liệu đã lưu ở đây.</div>'
      +'<div class="status" id="b-status"></div><div id="b-table"></div>';
    panel.appendChild(card);
    const {data,error}=await db.from('city_boundaries').select('city_id,updated_at');
    if(error){ setStatus('b-status','Lỗi tải: '+error.message,'err'); return; }
    const have=new Map((data||[]).map(r=>[r.city_id,r.updated_at]));
    const table=document.createElement('table');
    table.innerHTML='<thead><tr><th>Thành phố</th><th>Trạng thái</th><th>File ranh giới</th><th></th></tr></thead>';
    const tbody=document.createElement('tbody');
    CITY_BOUNDARIES.forEach(c=>{
      const tr=document.createElement('tr');
      const t1=document.createElement('td'); t1.textContent=c.name; tr.appendChild(t1);
      const t2=document.createElement('td');
      const setState=(ts)=>{ t2.textContent=ts?('Đã có · '+new Date(ts).toLocaleString('vi-VN')):'Chưa có'; t2.className=ts?'ok':'small'; };
      setState(have.get(c.id)); tr.appendChild(t2);
      const t3=document.createElement('td'); const f=document.createElement('input'); f.type='file'; f.accept='.json,.geojson,application/json'; t3.appendChild(f); tr.appendChild(t3);
      const t4=document.createElement('td'); const b=document.createElement('button'); b.className='go'; b.style.margin='0'; b.textContent='Lưu';
      b.onclick=()=>saveBoundary(c,f,b,setState);
      t4.appendChild(b); tr.appendChild(t4);
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    document.getElementById('b-table').appendChild(table);
  }

  async function saveBoundary(c,input,btn,setState){
    const file=input.files&&input.files[0];
    if(!file){ setStatus('b-status','Chọn file cho '+c.name+'.','err'); return; }
    if(file.size>5*1024*1024){ setStatus('b-status','File quá lớn (tối đa 5 MB).','err'); return; }
    let geom=null;
    try{ geom=geometryFrom(JSON.parse(await file.text())); }
    catch(e){ setStatus('b-status',c.name+': file không phải JSON hợp lệ.','err'); return; }
    if(!geom){ setStatus('b-status',c.name+': không tìm thấy ranh giới Polygon/MultiPolygon trong file.','err'); return; }
    btn.disabled=true;
    const now=new Date().toISOString();
    const {error}=await db.from('city_boundaries').upsert({city_id:c.id,name:c.name,geojson:geom,updated_at:now},{onConflict:'city_id'});
    btn.disabled=false;
    if(error){ setStatus('b-status','Lỗi lưu '+c.name+': '+error.message,'err'); return; }
    setState(now);
    input.value='';
    setStatus('b-status','Đã lưu ranh giới '+c.name+'.','ok');
  }

  // ---------- Thanh con "Quận thành phố" (game Đại Dịch) ----------
  // Mỗi thành phố một file GeoJSON FeatureCollection; mỗi quận là một Feature Polygon/MultiPolygon có thuộc tính name.
  function districtsFrom(json){
    if(!json || json.type!=='FeatureCollection' || !Array.isArray(json.features)) return null;
    const feats=json.features.filter(f=>f&&f.geometry&&(f.geometry.type==='Polygon'||f.geometry.type==='MultiPolygon'));
    if(!feats.length) return null;
    const out=feats.map((f,i)=>({type:'Feature',properties:{name:(f.properties&&(f.properties.name||f.properties['name:vi']||f.properties['name:en']))||('Quận '+(i+1))},geometry:f.geometry}));
    return {type:'FeatureCollection',features:out};
  }

  async function renderDistricts(panel){
    const card=document.createElement('div'); card.className='card';
    card.innerHTML='<h2 style="margin-top:0">Quận thành phố</h2>'
      +'<div class="small">Mỗi thành phố tải một file GeoJSON FeatureCollection, mỗi quận là một Polygon có thuộc tính <code>name</code>.</div>'
      +'<div class="status" id="d-status"></div><div id="d-table"></div>';
    panel.appendChild(card);
    const {data,error}=await db.from('city_districts').select('city_id,updated_at,geojson');
    if(error){ setStatus('d-status','Lỗi tải: '+error.message,'err'); return; }
    const have=new Map((data||[]).map(r=>[r.city_id,r]));
    const table=document.createElement('table');
    table.innerHTML='<thead><tr><th>Thành phố</th><th>Trạng thái</th><th>File quận</th><th></th></tr></thead>';
    const tbody=document.createElement('tbody');
    CITY_BOUNDARIES.forEach(c=>{
      const tr=document.createElement('tr');
      const t1=document.createElement('td'); t1.textContent=c.name; tr.appendChild(t1);
      const t2=document.createElement('td');
      const setState=(row)=>{
        if(!row){ t2.textContent='Chưa có'; t2.className='small'; return; }
        const n=(row.geojson&&row.geojson.features)?row.geojson.features.length:0;
        t2.textContent='Đã có '+n+' quận · '+new Date(row.updated_at).toLocaleString('vi-VN'); t2.className='ok';
      };
      setState(have.get(c.id)); tr.appendChild(t2);
      const t3=document.createElement('td'); const f=document.createElement('input'); f.type='file'; f.accept='.json,.geojson,application/json'; t3.appendChild(f); tr.appendChild(t3);
      const t4=document.createElement('td'); const b=document.createElement('button'); b.className='go'; b.style.margin='0'; b.textContent='Lưu';
      b.onclick=()=>saveDistricts(c,f,b,setState);
      t4.appendChild(b); tr.appendChild(t4);
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    document.getElementById('d-table').appendChild(table);
  }

  async function saveDistricts(c,input,btn,setState){
    const file=input.files&&input.files[0];
    if(!file){ setStatus('d-status','Chọn file quận cho '+c.name+'.','err'); return; }
    if(file.size>20*1024*1024){ setStatus('d-status','File quá lớn (tối đa 20 MB).','err'); return; }
    let fc=null;
    try{ fc=districtsFrom(JSON.parse(await file.text())); }
    catch(e){ setStatus('d-status',c.name+': file không phải JSON hợp lệ.','err'); return; }
    if(!fc){ setStatus('d-status',c.name+': file phải là FeatureCollection có ít nhất một quận dạng Polygon.','err'); return; }
    btn.disabled=true;
    const row={city_id:c.id,name:c.name,geojson:fc,updated_at:new Date().toISOString()};
    const {error}=await db.from('city_districts').upsert(row,{onConflict:'city_id'});
    btn.disabled=false;
    if(error){ setStatus('d-status','Lỗi lưu '+c.name+': '+error.message,'err'); return; }
    setState(row);
    input.value='';
    setStatus('d-status','Đã lưu '+fc.features.length+' quận của '+c.name+'.','ok');
  }

  // ---------- Đăng nhập / sự kiện ----------
  $('btn-login').onclick=async()=>{
    setStatus('login-status','Đang đăng nhập...');
    const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
    if(error){ setStatus('login-status','Đăng nhập thất bại: '+error.message,'err'); return; }
    $('password').value=''; setStatus('login-status','');
  };
  $('btn-google').onclick=async()=>{
    const {error}=await db.auth.signInWithOAuth({provider:'google',options:{redirectTo:window.location.origin+'/admin/zombie-config/'}});
    if(error) setStatus('login-status','Không thể đăng nhập bằng Google: '+error.message,'err');
  };
  $('btn-logout').onclick=async()=>{ await db.auth.signOut(); };

  db.auth.onAuthStateChange((_e,session)=>{ showAuth(session); });
  db.auth.getSession().then(({data})=>showAuth(data.session));
})();
</script>
