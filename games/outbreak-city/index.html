<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đại Dịch Thành Phố — MassGames</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../../assets/config.js"></script>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#12141a;color:#e8e8e8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
a{color:#8b93a7;text-decoration:none}
a:hover{color:#f0c060}
.hidden{display:none !important}
.small{font-size:12px;color:#8a92a6}

/* Chọn thành phố */
#picker{height:100%;overflow-y:auto;padding:24px 20px 40px}
#picker .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
#picker h1{margin:0;font-size:24px;color:#f0c060}
#picker p{color:#8a92a6;margin:6px 0 20px}
.cities{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;max-width:1000px}
.city{background:#1a1d26;border:1px solid #2a3144;border-radius:10px;padding:16px;text-align:left;color:#eee;cursor:pointer;font:inherit}
.city:hover:not(:disabled){background:#243055;border-color:#3b4a78}
.city:disabled{opacity:.45;cursor:not-allowed}
.city b{display:block;font-size:16px;color:#f0c060;margin-bottom:4px}
.city span{font-size:12px;color:#8a92a6}

/* Màn chơi */
#game{position:fixed;inset:0}
#map{position:absolute;inset:0}
.panel{position:absolute;background:rgba(18,20,26,.88);border:1px solid #2a3144;border-radius:10px;padding:10px 14px;backdrop-filter:blur(4px);z-index:2}
#hud{top:12px;left:12px;width:280px}
#hud h2{margin:0 0 4px;font-size:16px;color:#f0c060}
#hud .stat{display:flex;justify-content:space-between;font-size:13px;margin:3px 0}
#hud .stat b{color:#fff}
#hud .msg{margin-top:8px;font-size:13px;color:#cfd6e4;min-height:18px}
#sel{bottom:12px;left:12px;width:320px}
#sel h3{margin:0 0 4px;font-size:15px;color:#f0c060}
#sel .row{font-size:13px;margin:2px 0;color:#cfd6e4}
#sel button{margin-top:8px;width:100%;background:#2a3144;color:#eee;border:1px solid #47506a;border-radius:8px;padding:8px 10px;font:inherit;font-size:13px;cursor:pointer}
#sel button:hover:not(:disabled){background:#384262}
#sel button:disabled{opacity:.4;cursor:not-allowed}
#log{top:12px;right:12px;width:300px;max-height:45vh;overflow:hidden;font-size:12px;color:#cfd6e4}
#log div{padding:3px 0;border-bottom:1px solid #222838}
#log div:first-child{color:#fff}
.topbtns{position:absolute;right:12px;bottom:12px;z-index:2;display:flex;gap:8px}
.btn{background:#2a3144;color:#eee;border:1px solid #47506a;border-radius:8px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer;display:inline-block}
.btn:hover{background:#384262}
#banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(18,20,26,.94);border:1px solid #3b4a78;border-radius:12px;padding:20px 26px;text-align:center;z-index:3;font-size:15px;max-width:90%}
#banner h2{margin:0 0 8px;color:#f0c060}
#banner .btn{margin-top:12px}
.err{color:#ff7b7b}
</style>
</head>
<body>

<section id="picker">
  <div class="top">
    <div>
      <h1>Đại Dịch Thành Phố</h1>
      <p>Chọn một thành phố để bắt đầu. Dịch bùng phát, bạn chọn một quận làm căn cứ, cứu người và mở rộng cho đến khi cả thành phố an toàn.</p>
    </div>
    <a href="../../">← Trang chủ</a>
  </div>
  <div class="small" id="picker-status"></div>
  <div class="cities" id="cities"></div>
</section>

<section id="game" class="hidden">
  <div id="map"></div>
  <div class="panel" id="hud">
    <h2 id="hud-city"></h2>
    <div class="stat"><span>Giờ</span><b id="hud-t">0</b></div>
    <div class="stat"><span>Vật tư</span><b id="hud-supplies">0</b></div>
    <div class="stat"><span>Người sống sót</span><b id="hud-survivors">0</b></div>
    <div class="stat"><span>Quận an toàn</span><b id="hud-players">0/0</b></div>
    <div class="stat"><span>Quận bị dịch</span><b id="hud-infected">0</b></div>
    <div class="msg" id="hud-msg"></div>
  </div>
  <div class="panel" id="sel"></div>
  <div class="panel" id="log"></div>
  <div class="topbtns">
    <button class="btn" id="btn-restart">Chơi lại thành phố này</button>
    <button class="btn" id="btn-change">Chọn thành phố khác</button>
    <a class="btn" href="../../">Trang chủ</a>
  </div>
  <div id="banner" class="hidden"></div>
</section>

<script>
(function(){
  const cfg = window.MASSGAMES_CONFIG;
  const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_PUBLISHABLE_KEY, { auth:{ persistSession:false } });
  const STYLE = 'https://tiles.openfreemap.org/styles/liberty';
  const CITIES = [
    { id:'hanoi',     name:'Hà Nội',          country:'Việt Nam',  lng:105.8542, lat:21.0285 },
    { id:'hcm',       name:'TP. Hồ Chí Minh', country:'Việt Nam',  lng:106.7009, lat:10.7769 },
    { id:'danang',    name:'Đà Nẵng',         country:'Việt Nam',  lng:108.2022, lat:16.0544 },
    { id:'tokyo',     name:'Tokyo',           country:'Nhật Bản',  lng:139.6503, lat:35.6762 },
    { id:'singapore', name:'Singapore',       country:'Singapore', lng:103.8198, lat:1.3521 },
    { id:'paris',     name:'Paris',           country:'Pháp',      lng:2.3522,   lat:48.8566 },
    { id:'london',    name:'London',          country:'Anh',       lng:-0.1278,  lat:51.5074 },
    { id:'newyork',   name:'New York',        country:'Hoa Kỳ',    lng:-74.0060, lat:40.7128 }
  ];
  // Cân bằng trò chơi (đơn vị: nghìn người, vật tư)
  const TICK_MS = 1000;
  const COST = { rescue:20, expand:40, fortify:25 };
  const RESCUE_GAIN = 6, RESCUE_DROP = 35, FORTIFY_DROP = 40;
  const EMPTY = { type:'FeatureCollection', features:[] };

  const $ = id => document.getElementById(id);
  let map = null, styleReady = false;
  let G = null;          // trạng thái ván chơi
  let timer = null;
  let cityNow = null;

  // ---------- Chọn thành phố ----------
  const list = $('cities');
  CITIES.forEach(c=>{
    const b = document.createElement('button');
    b.className = 'city'; b.dataset.id = c.id;
    b.innerHTML = '<b></b><span></span>';
    b.querySelector('b').textContent = c.name;
    b.querySelector('span').textContent = c.country;
    b.onclick = ()=>chooseCity(c);
    list.appendChild(b);
  });
  (async()=>{
    const {data,error}=await sb.from('city_districts').select('city_id');
    if(error){ $('picker-status').textContent='Lỗi tải dữ liệu: '+error.message; return; }
    const have=new Set((data||[]).map(r=>r.city_id));
    list.querySelectorAll('button.city').forEach(b=>{
      if(!have.has(b.dataset.id)){ b.disabled=true; b.querySelector('span').textContent+=' · chưa có dữ liệu quận'; }
    });
  })();

  async function chooseCity(c){
    $('picker-status').textContent='Đang tải quận của '+c.name+'...';
    const {data,error}=await sb.from('city_districts').select('geojson').eq('city_id',c.id).maybeSingle();
    if(error||!data){ $('picker-status').textContent='Không tải được quận của '+c.name+(error?' ('+error.message+')':''); return; }
    $('picker-status').textContent='';
    cityNow = c;
    newGame(c, data.geojson.features);
    showGame();
  }

  function showPicker(){
    stopTimer(); G=null;
    $('game').classList.add('hidden');
    $('picker').classList.remove('hidden');
  }
  function showGame(){
    $('picker').classList.add('hidden');
    $('game').classList.remove('hidden');
    if(!map) createMap(); else { renderMap(); }
    render();
  }

  // ---------- Hình học ----------
  function bboxOf(geom){
    let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
    (function walk(a){
      if(typeof a[0]==='number'){ const [x,y]=a; if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; }
      else a.forEach(walk);
    })(geom.coordinates);
    return [minX,minY,maxX,maxY];
  }
  function touches(a,b){ const e=0.0005; return a[0]<=b[2]+e && b[0]<=a[2]+e && a[1]<=b[3]+e && b[1]<=a[3]+e; }

  // ---------- Ván chơi ----------
  function newGame(c, features){
    stopTimer();
    if(map) map.__fitted=false;   // căn khung nhìn lại theo thành phố mới
    const ds = features.map((f,i)=>{
      const bb = bboxOf(f.geometry);
      return { id:'d'+i, name:(f.properties&&f.properties.name)||('Quận '+(i+1)), geom:f.geometry, bbox:bb,
        center:[(bb[0]+bb[2])/2,(bb[1]+bb[3])/2], pop:30+Math.floor(Math.random()*170),
        state:'none', zombies:0, infection:0, survivors:0, nb:[] };
    });
    ds.forEach((a,i)=>ds.forEach((b,j)=>{ if(i!==j && touches(a.bbox,b.bbox)) a.nb.push(b); }));
    G = { city:c, districts:ds, phase:'pick', t:0, supplies:100, selected:null, log:[], msg:'Chọn một quận làm căn cứ để bắt đầu.' };
    addLog('Ván mới ở '+c.name+'. Chọn quận làm căn cứ.');
  }

  function infect(d, zombies, silent){
    const wasPlayer = d.state==='player';
    const lost = wasPlayer ? d.survivors : 0;
    d.state='infected'; d.zombies=zombies; d.infection=0; d.survivors=0;
    if(!silent) addLog((wasPlayer?'Dịch đã xâm nhập '+d.name+', mất '+Math.round(lost)+'k người':'Dịch lan đến '+d.name));
  }

  function startAt(d){
    d.state='player'; d.survivors=Math.round(d.pop*0.5); d.infection=0;
    // Ổ dịch bắt đầu ở quận xa căn cứ nhất
    let far=null, best=-1;
    G.districts.forEach(x=>{ if(x===d) return; const dist=Math.hypot(x.center[0]-d.center[0],x.center[1]-d.center[1]); if(dist>best){ best=dist; far=x; } });
    if(far) infect(far, 35, true);
    G.phase='play';
    G.msg='Dịch bùng phát tại '+(far?far.name:'')+'. Bảo vệ căn cứ và mở rộng.';
    addLog('Căn cứ: '+d.name+'. Ổ dịch: '+(far?far.name:'?')+'.');
    startTimer();
    render();
  }

  function tick(){
    if(!G || G.phase!=='play') return;
    G.t++;
    const infected = G.districts.filter(d=>d.state==='infected');
    infected.forEach(d=>{ d.zombies=Math.min(100,d.zombies+0.5); });
    infected.forEach(d=>{
      d.nb.forEach(n=>{
        if(n.state==='infected') return;
        n.infection += 1.2*(d.zombies/100);
        if(n.infection>=100) infect(n, 30, false);
      });
    });
    G.districts.forEach(d=>{
      if(d.state==='player'){ d.infection=Math.max(0,d.infection-0.2); G.supplies += d.survivors*0.06; }
      else if(d.state==='none'){ d.infection=Math.max(0,d.infection-0.1); }
    });
    const players = G.districts.filter(d=>d.state==='player').length;
    if(players===0){ G.phase='lost'; stopTimer(); G.msg='Thất bại: không còn quận nào an toàn.'; addLog(G.msg); showBanner('Thất bại','Dịch đã chiếm toàn bộ căn cứ. Thử lại?'); }
    else if(players===G.districts.length){ G.phase='won'; stopTimer(); G.msg='Chiến thắng: cả thành phố đã an toàn!'; addLog(G.msg); showBanner('Chiến thắng','Bạn đã giải phóng '+G.city.name+' khỏi dịch.'); }
    render();
  }

  function startTimer(){ stopTimer(); timer=setInterval(tick,TICK_MS); }
  function stopTimer(){ if(timer){ clearInterval(timer); timer=null; } }

  function addLog(text){
    G.log.unshift('Giờ '+G.t+': '+text);
    if(G.log.length>40) G.log.length=40;
  }

  // ---------- Hành động ----------
  function actionFor(d){
    const adj = d.nb.filter(n=>n.state==='player');
    if(G.phase!=='play') return { label:'Ván đã kết thúc', enabled:false };
    if(d.state==='infected'){
      if(!adj.length) return { label:'Cần quận an toàn kề bên để cứu người', enabled:false };
      return { label:'Cứu người (−'+COST.rescue+' vật tư)', enabled:G.supplies>=COST.rescue, run:()=>rescue(d,adj) };
    }
    if(d.state==='none'){
      if(!adj.length) return { label:'Cần quận an toàn kề bên để mở rộng', enabled:false };
      return { label:'Mở rộng về quận này (−'+COST.expand+' vật tư)', enabled:G.supplies>=COST.expand, run:()=>expand(d) };
    }
    return { label:'Củng cố phòng thủ (−'+COST.fortify+' vật tư)', enabled:G.supplies>=COST.fortify, run:()=>fortify(d) };
  }

  function rescue(d, adj){
    G.supplies -= COST.rescue;
    d.zombies -= RESCUE_DROP;
    const home = adj.slice().sort((a,b)=>b.survivors-a.survivors)[0];
    home.survivors += RESCUE_GAIN;
    if(d.zombies<=0){
      d.state='player'; d.zombies=0; d.infection=0; d.survivors=Math.round(d.pop*0.15);
      addLog('Giải phóng '+d.name+'! Cứu được thêm người sống sót.');
    } else {
      addLog('Cứu '+RESCUE_GAIN+'k người từ '+d.name+' (còn '+Math.round(d.zombies)+'% zombie).');
    }
    render();
  }

  function expand(d){
    G.supplies -= COST.expand;
    d.state='player'; d.infection=0; d.survivors=Math.round(d.pop*0.25);
    addLog('Mở rộng sang '+d.name+' (+'+d.survivors+'k người).');
    render();
  }

  function fortify(d){
    G.supplies -= COST.fortify;
    d.infection=Math.max(0,d.infection-FORTIFY_DROP);
    addLog('Củng cố '+d.name+'.');
    render();
  }

  // ---------- Bản đồ ----------
  function createMap(){
    const c = cityNow;
    map = new maplibregl.Map({
      container:'map', style:STYLE, center:[c.lng,c.lat], zoom:11, pitch:50, bearing:-17,
      maxPitch:80, minZoom:10, maxBounds:aroundBounds(c,0.25), attributionControl:{compact:true}
    });
    map.on('style.load', ()=>{
      styleReady=true;
      addLayers();
      renderMap(true);
    });
    map.on('click','dist-fill',e=>{
      const f=e.features&&e.features[0]; if(!f||!G) return;
      const d=G.districts.find(x=>x.id===f.properties.id); if(!d) return;
      if(G.phase==='pick'){ startAt(d); return; }
      G.selected=d.id; render();
    });
    map.on('mouseenter','dist-fill',()=>{ map.getCanvas().style.cursor='pointer'; });
    map.on('mouseleave','dist-fill',()=>{ map.getCanvas().style.cursor=''; });
    map.on('error', e=>{
      const msg=(e&&e.error&&e.error.message)?e.error.message:'không rõ';
      if(G){ addLog('Lỗi bản đồ: '+msg); render(); }
    });
  }

  function addLayers(){
    const style=map.getStyle();
    const vsrc=Object.keys(style.sources).find(k=>style.sources[k].type==='vector');
    const firstSymbol=(style.layers.find(l=>l.type==='symbol')||{}).id;
    if(vsrc){
      map.addLayer({
        id:'city-3d-buildings', type:'fill-extrusion', source:vsrc, 'source-layer':'building', minzoom:13,
        filter:['==',0,1],
        paint:{
          'fill-extrusion-color':['interpolate',['linear'],['coalesce',['get','render_height'],10],0,'#d8d2c4',60,'#c0b8a6',200,'#9aa3b2'],
          'fill-extrusion-height':['coalesce',['get','render_height'],8],
          'fill-extrusion-base':['coalesce',['get','render_min_height'],0],
          'fill-extrusion-opacity':0.95
        }
      }, firstSymbol);
    }
    map.addSource('districts',{type:'geojson',data:EMPTY});
    map.addLayer({id:'dist-fill',type:'fill',source:'districts',paint:{
      'fill-color':['match',['get','state'],'player','#3fbf6a','infected','#d64545','#8b93a7'],
      'fill-opacity':['match',['get','state'],'none',0.12,'player',0.28,['interpolate',['linear'],['get','zombies'],0,0.2,100,0.55]]
    }},firstSymbol);
    map.addLayer({id:'dist-line',type:'line',source:'districts',paint:{'line-color':'#f0c060','line-width':1.4,'line-opacity':0.85}},firstSymbol);
    map.addLayer({id:'dist-sel',type:'line',source:'districts',filter:['==',['get','id'],''],paint:{'line-color':'#ffffff','line-width':4}},firstSymbol);
  }

  // Đặt lại lớp quận, toà nhà (chỉ trong thành phố) và khung nhìn
  function aroundBounds(c,r){ return [[c.lng-r,c.lat-r],[c.lng+r,c.lat+r]]; }

  function renderMap(fit){
    if(!styleReady || !G) return;
    map.getSource('districts').setData({ type:'FeatureCollection', features: G.districts.map(d=>({
      type:'Feature', properties:{ id:d.id, name:d.name, state:d.state, zombies:Math.round(d.zombies) }, geometry:d.geom })) });
    map.setFilter('dist-sel',['==',['get','id'],G.selected||'']);
    if(fit || !map.__fitted){
      const polys=[]; G.districts.forEach(d=>{ if(d.geom.type==='Polygon') polys.push(d.geom.coordinates); else d.geom.coordinates.forEach(p=>polys.push(p)); });
      map.setFilter('city-3d-buildings',['within',{type:'MultiPolygon',coordinates:polys}]);
      const bb=[Infinity,Infinity,-Infinity,-Infinity];
      G.districts.forEach(d=>{ bb[0]=Math.min(bb[0],d.bbox[0]); bb[1]=Math.min(bb[1],d.bbox[1]); bb[2]=Math.max(bb[2],d.bbox[2]); bb[3]=Math.max(bb[3],d.bbox[3]); });
      // Khoá khung nhìn trong thành phố, không cho kéo ra toàn thế giới
      map.setMaxBounds([[bb[0]-0.03,bb[1]-0.03],[bb[2]+0.03,bb[3]+0.03]]);
      map.fitBounds([[bb[0],bb[1]],[bb[2],bb[3]]],{padding:60,pitch:50,bearing:-17,duration:1200,maxZoom:14});
      map.__fitted=true;
    }
  }

  // ---------- Giao diện ----------
  function render(){
    if(!G) return;
    if(styleReady) renderMap(false);
    const players=G.districts.filter(d=>d.state==='player');
    const infected=G.districts.filter(d=>d.state==='infected').length;
    const people=players.reduce((s,d)=>s+d.survivors,0);
    $('hud-city').textContent=G.city.name;
    $('hud-t').textContent=G.t;
    $('hud-supplies').textContent=Math.floor(G.supplies);
    $('hud-survivors').textContent=Math.round(people)+'k';
    $('hud-players').textContent=players.length+'/'+G.districts.length;
    $('hud-infected').textContent=infected;
    $('hud-msg').textContent=G.msg||'';

    const sel=$('sel'); sel.textContent='';
    const d=G.districts.find(x=>x.id===G.selected);
    if(!d){
      const p=document.createElement('div'); p.className='row';
      p.textContent = G.phase==='pick' ? 'Nhấn vào một quận trên bản đồ để chọn làm căn cứ.' : 'Nhấn vào một quận trên bản đồ để xem và hành động.';
      sel.appendChild(p);
    } else {
      const h=document.createElement('h3'); h.textContent=d.name; sel.appendChild(h);
      const st = d.state==='player'?'An toàn (của bạn)':d.state==='infected'?'Đang bị dịch':'Chưa kiểm soát';
      [['Trạng thái',st],['Dân số',d.pop+'k']].forEach(([a,b])=>{ const r=document.createElement('div'); r.className='row'; r.textContent=a+': '+b; sel.appendChild(r); });
      if(d.state==='player'){
        const r=document.createElement('div'); r.className='row'; r.textContent='Người sống sót: '+Math.round(d.survivors)+'k · Nguy cơ dịch: '+Math.round(d.infection)+'%'; sel.appendChild(r);
      } else if(d.state==='infected'){
        const r=document.createElement('div'); r.className='row'; r.textContent='Mật độ zombie: '+Math.round(d.zombies)+'%'; sel.appendChild(r);
      } else {
        const r=document.createElement('div'); r.className='row'; r.textContent='Nguy cơ bị dịch: '+Math.round(d.infection)+'%'; sel.appendChild(r);
      }
      const a=actionFor(d);
      const btn=document.createElement('button'); btn.textContent=a.label; btn.disabled=!(a.enabled&&a.run);
      btn.onclick=()=>{ if(a.run) a.run(); };
      sel.appendChild(btn);
    }

    const lg=$('log'); lg.textContent='';
    G.log.slice(0,8).forEach(t=>{ const div=document.createElement('div'); div.textContent=t; lg.appendChild(div); });
  }

  function showBanner(title, text){
    const b=$('banner');
    b.textContent='';
    const h=document.createElement('h2'); h.textContent=title; b.appendChild(h);
    const p=document.createElement('div'); p.textContent=text; b.appendChild(p);
    const again=document.createElement('button'); again.className='btn'; again.textContent='Chơi lại'; again.onclick=()=>{ b.classList.add('hidden'); restart(); };
    b.appendChild(again);
    b.classList.remove('hidden');
  }

  function restart(){
    if(!cityNow) return showPicker();
    $('banner').classList.add('hidden');
    chooseCityReload(cityNow);
  }
  async function chooseCityReload(c){
    const {data,error}=await sb.from('city_districts').select('geojson').eq('city_id',c.id).maybeSingle();
    if(error||!data) return showPicker();
    newGame(c, data.geojson.features);
    if(map){ map.__fitted=false; }
    render();
    if(styleReady) renderMap(true);
  }

  $('btn-restart').onclick = restart;
  $('btn-change').onclick = ()=>{ $('banner').classList.add('hidden'); showPicker(); };
})();
</script>
</body>
</html>
